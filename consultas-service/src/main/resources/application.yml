server:
  port: 8083

spring:
  application:
    name: consultas-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/rica_consultas
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: consultas-service
      auto-offset-reset: earliest

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
